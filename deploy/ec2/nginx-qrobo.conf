# QROBO nginx site. setup-server.sh replaces __DOMAIN__. HTTP only at first, so the site can be
# tested by IP before DNS moves; `certbot --nginx` then adds HTTPS and the http->https redirect.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name __DOMAIN__ www.__DOMAIN__ _;

  client_max_body_size 1m;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;          # used by the app's rate limiter
    proxy_set_header X-Forwarded-For $remote_addr;    # overwrite, never append client-supplied values
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
  }
}
